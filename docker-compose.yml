# One instance, one reader. The app is single-user by design — one lexicon, one
# library, USER_ID 1 — so anyone you give the URL to is reading with your
# vocabulary, which is exactly what a demo wants and is not a login system.
#
# To give someone their own: copy the `reader` block under a new name with its
# own volume, and add a matching host to the Caddyfile. That is the whole of
# "multi-user" until there is a reason for more.
services:
  reader:
    build: .
    restart: unless-stopped
    volumes: [reader-data:/data]
    expose: ["8000"]

  # TLS and a password. The app has no auth of its own: never expose it directly.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [reader]

volumes:
  reader-data:
  caddy-data:
  caddy-config:
