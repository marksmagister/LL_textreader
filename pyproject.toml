[project]
name = "ll-textreader"
version = "0.0.1"
description = "A reading app that colours every word by whether you know it."
requires-python = ">=3.12,<3.13"   # spaCy/Stanza lag behind the newest CPython
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Installed per language so a Dutch-only setup doesn't pull Arabic tooling.
nlp = ["spacy>=3.8"]
arabic = ["camel-tools>=1.5"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx>=0.27"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["backend/ll_textreader"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
