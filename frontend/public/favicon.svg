<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="LL_textreader">
  <!-- A page of text with two words asking for something: the product, at 120px.
       Grey bars are words you can already read. The yellow one is a word you are
       learning; the blue one you have never judged. Two of the five render states
       (CLAUDE.md, "The core model") — the mark is the palette, not a picture of
       a book.

       Both accents are deepened from the reader's own tokens: yellow #ffdd7d
       rather than #ffe9a8, blue #7fb0e8 (the novel-form token) rather than the
       very pale #cfe4ff. Those two are text highlights sitting behind real words
       at reading size; as solid blocks at 20px they wash out to nothing, and a
       favicon has to survive 20px.

       PNGs for anywhere that cannot take an SVG — Google's OAuth consent screen
       among them — are in docs/brand/. -->
  <rect width="120" height="120" rx="22" fill="#fdfdfb"/>

  <rect x="22" y="36" width="28" height="9" rx="2" fill="#4c4c50"/>
  <rect x="54" y="36" width="36" height="9" rx="2" fill="#ffdd7d"/>

  <rect x="22" y="56" width="18" height="9" rx="2" fill="#4c4c50"/>
  <rect x="44" y="56" width="26" height="9" rx="2" fill="#7fb0e8"/>
  <rect x="74" y="56" width="24" height="9" rx="2" fill="#4c4c50"/>

  <rect x="22" y="76" width="34" height="9" rx="2" fill="#4c4c50"/>
  <rect x="60" y="76" width="20" height="9" rx="2" fill="#4c4c50"/>
</svg>
